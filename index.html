<!doctype html>
<html lang="fr">
<head>

<meta name="theme-color" content="#101a1c">
<title>Dernier Relais</title>
</head>
<body>
<div id="map"></div>
<header id="top">
  <strong>Dernier Relais</strong><span class="tag">socle · étape 2</span>
  <span id="mode" class="pill">démarrage…</span>
</header>
<section id="panel">
  <dl id="stats">
    <div><dt>Abris</dt><dd id="nShel">–</dd></div>
    <div><dt>Abri le plus proche</dt><dd id="near">–</dd></div>

  <p id="msg" role="status">Touche la carte pour te déplacer en mode simulé.</p>
  <div class="row">
    <button id="gps" type="button">Ma position GPS</button>
    <label class="sr" for="goto">Aller à un lieu de test</label>
    <select id="goto"><option value="">Aller à un lieu de test…</option></select>

<script type="module" src="/src/main.ts"></script>
